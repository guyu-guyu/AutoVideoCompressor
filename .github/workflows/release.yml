name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build frontend
        run: npm run build

      - name: Build release binary
        run: cd src-tauri && cargo build --release

      - name: Rename executable with version suffix
        run: node scripts/rename-exe.cjs

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from tagged commit
        shell: pwsh
        run: |
          $releaseNotes = git log -1 --format=%B HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to read the tagged commit message."
          }
          if ([string]::IsNullOrWhiteSpace(($releaseNotes -join "`n"))) {
            throw "The tagged commit message is empty."
          }
          $releaseNotes | Set-Content -Path release-notes.md -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: src-tauri/target/release/AutoVideoCompressor_*.exe
