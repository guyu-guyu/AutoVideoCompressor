[package]
name = "autocompress"
version = "0.1.0"
description = "AutoCompress - Video compression tool"
authors = ["guyu"]
edition = "2021"

[lib]
name = "autocompress_lib"
path = "src/lib.rs"

[[bin]]
name = "autocompress"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = "0.4"
walkdir = "2"
fs4 = "0.8"

[dev-dependencies]
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
